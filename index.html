<script>
// ============================================================
// SUPABASE CONFIG
// These two placeholders are NOT real values — they get swapped for the real
// project URL and anon key at deploy time (see README.md → "Deploying").
// The actual values live only in Cloudflare Pages' environment variable
// settings, never in this file or in git history.
//
// Note on the anon key specifically: it's called "anon" because it's designed
// to be public — Supabase expects it to sit in client-side code like this.
// It's not a password. The real access control is the locked-down database
// functions in schema.sql (which only allow fetching one exact key at a
// time, not browsing everything) — never the secrecy of this key.
// NEVER put a "service_role" key here or anywhere in this repo — that one
// bypasses all row-level security and is the one that must stay truly secret.
// ============================================================
const SUPABASE_URL = '__SUPABASE_URL__';
const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';

const state = { code:null, name:null, group:null, tripId:null, trip:null };

// ---------- storage helpers ----------
// Personal, device-only data (like "which crew/name did I last use") lives in
// localStorage — no need to hit the network for that.
// Shared, cross-device data (crews, outings, expenses) goes through Supabase,
// via the locked-down kv_get/kv_set functions defined in schema.sql — the
// public API key can only ever fetch or write one exact key at a time, never
// list or browse everything, which mirrors how the crew-code access worked before.
// Small visible error banner — storage failures used to fail silently and just
// bounce back to the dashboard, which was impossible to debug. Now they show up.
function showErrorToast(msg){
  let el = document.getElementById('err-toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'err-toast';
    el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-family:Inter,sans-serif;font-size:13px;font-weight:600;max-width:90vw;z-index:9999;box-shadow:4px 4px 0 var(--red);';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 6000);
}

async function getJSON(key, shared){
  if(!shared){
    try{
      const v = localStorage.getItem('sc:' + key);
      return v ? JSON.parse(v) : null;
    }catch(e){ return null; }
  }
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/kv_get`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ p_key: key })
    });
    if(!res.ok){
      const errText = await res.text().catch(() => '');
      console.error('kv_get failed:', res.status, errText);
      showErrorToast(`Couldn't reach the database (${res.status}). Open the browser console for details.`);
      return null;
    }
    const data = await res.json();
    return (data === null || data === undefined) ? null : data;
  }catch(e){
    console.error('kv_get failed', e);
    showErrorToast('Network error reaching the database — check your connection.');
    return null;
  }
}
async function setJSON(key, value, shared){
  if(!shared){
    try{
      localStorage.setItem('sc:' + key, JSON.stringify(value));
      return true;
    }catch(e){ return false; }
  }
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/kv_set`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ p_key: key, p_value: value })
    });
    if(!res.ok){
      const errText = await res.text().catch(() => '');
      console.error('kv_set failed:', res.status, errText);
      showErrorToast(`Save failed (${res.status}). Open the browser console for details.`);
      return false;
    }
    return true;
  }catch(e){
    console.error('kv_set failed', e);
    showErrorToast('Network error saving — check your connection.');
    return false;
  }
}
async function deleteJSON(key, shared){
  if(!shared){
    try{ localStorage.removeItem('sc:' + key); return true; }catch(e){ return false; }
  }
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/kv_delete`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ p_key: key })
    });
    if(!res.ok){
      const errText = await res.text().catch(() => '');
      console.error('kv_delete failed:', res.status, errText);
      showErrorToast(`Delete failed (${res.status}). Open the browser console for details.`);
      return false;
    }
    return true;
  }catch(e){
    console.error('kv_delete failed', e);
    showErrorToast('Network error deleting — check your connection.');
    return false;
  }
}

// Used only to build a safe storage key — never shown to the user.
// Storage keys can't contain whitespace, slashes, or quotes, so those get
// stripped/collapsed here, but the code people actually see (group.code)
// keeps whatever they typed, spaces and all.
function normalizeCode(raw){
  return (raw||'')
    .trim()
    .replace(/["'\\/]/g,'')
    .replace(/\s+/g,'-')
    .toUpperCase()
    .slice(0,120);
}
function groupKey(code){ return 'group:' + normalizeCode(code); }
function tripKey(code, tripId){ return 'trip:' + normalizeCode(code) + ':' + tripId; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function money(n){ return '₹' + (Math.round(n*100)/100).toLocaleString('en-IN'); }

// ---------- share links ----------
function getUrlParams(){
  try{ return new URLSearchParams(window.location.search); }catch(e){ return new URLSearchParams(); }
}
function clearUrlParams(){
  try{ window.history.replaceState({}, '', window.location.pathname); }catch(e){}
}
function shareLink(code, tripId){
  const base = window.location.origin + window.location.pathname;
  let url = base + '?crew=' + encodeURIComponent(code);
  if(tripId) url += '&trip=' + encodeURIComponent(tripId);
  return url;
}
// small popover with the link in a selectable box + copy button (clipboard API
// can be blocked in sandboxed previews, so this always works as a fallback)
function toggleShareBox(anchorBtn, url){
  const existing = document.getElementById('share-box');
  if(existing){ existing.remove(); if(existing.dataset.for === url) return; }
  const box = document.createElement('div');
  box.id = 'share-box';
  box.dataset.for = url;
  box.className = 'share-box';
  box.innerHTML = `
    <input readonly id="share-box-input" value="${escapeHtml(url)}">
    <button class="btn small teal" type="button" id="share-box-copy">Copy</button>
    <div class="share-note">Free forever and no subscription BS — share away.</div>
  `;
  anchorBtn.insertAdjacentElement('afterend', box);
  const inp = document.getElementById('share-box-input');
  inp.onclick = () => inp.select();
  document.getElementById('share-box-copy').onclick = async () => {
    let ok = false;
    try{ await navigator.clipboard.writeText(url); ok = true; }catch(e){
      try{ inp.select(); document.execCommand('copy'); ok = true; }catch(e2){ ok = false; }
    }
    const btn = document.getElementById('share-box-copy');
    btn.textContent = ok ? 'Copied!' : 'Select & copy';

// ---------- settlement engine ----------
function computeSettlement(members, expenses){
  const bal = {};
  members.forEach(m => bal[m] = 0);
  expenses.forEach(e => {
    if(!(e.paidBy in bal)) bal[e.paidBy] = 0;
    bal[e.paidBy] += e.amount;
    const share = e.amount / e.splitAmong.length;
    e.splitAmong.forEach(p => {
      if(!(p in bal)) bal[p] = 0;
      bal[p] -= share;
    });
  });
  Object.keys(bal).forEach(k => bal[k] = Math.round(bal[k]*100)/100);

  const creditors = Object.entries(bal).filter(([,v]) => v > 0.005).map(([n,v]) => ({n,v})).sort((a,b)=>b.v-a.v);
  const debtors = Object.entries(bal).filter(([,v]) => v < -0.005).map(([n,v]) => ({n,v:-v})).sort((a,b)=>b.v-a.v);
  const txns = [];
  let ci=0, di=0;
  while(ci < creditors.length && di < debtors.length){
    const c = creditors[ci], d = debtors[di];
    const amt = Math.min(c.v, d.v);
    if(amt > 0.005) txns.push({from:d.n, to:c.n, amount:Math.round(amt*100)/100});
    c.v -= amt; d.v -= amt;
    if(c.v <= 0.005) ci++;
    if(d.v <= 0.005) di++;
  }
  return { balances: bal, txns };
}

// non-simplified: net debts per pair only, no whole-group cancellation
function computeRawSettlement(members, expenses){
  const bal = {};
  members.forEach(m => bal[m] = 0);
  const owed = {}; // owed[a][b] = amount a owes b
  expenses.forEach(e => {
    if(!(e.paidBy in bal)) bal[e.paidBy] = 0;
    bal[e.paidBy] += e.amount;
    const share = e.amount / e.splitAmong.length;
    e.splitAmong.forEach(p => {
      if(!(p in bal)) bal[p] = 0;
      bal[p] -= share;
      if(p !== e.paidBy){
        owed[p] = owed[p] || {};
        owed[p][e.paidBy] = (owed[p][e.paidBy] || 0) + share;
      }
    });
  });
  Object.keys(bal).forEach(k => bal[k] = Math.round(bal[k]*100)/100);

  const people = [...new Set([...members, ...Object.keys(owed), ...Object.values(owed).flatMap(o=>Object.keys(o))])];
  const txns = [];
  for(let i=0;i<people.length;i++){
    for(let j=i+1;j<people.length;j++){
      const a = people[i], b = people[j];
      const ab = (owed[a] && owed[a][b]) || 0;
      const ba = (owed[b] && owed[b][a]) || 0;
      const net = Math.round((ab - ba)*100)/100;
      if(net > 0.005) txns.push({from:a, to:b, amount:net});
      else if(net < -0.005) txns.push({from:b, to:a, amount:-net});
    }
  }
  return { balances: bal, txns };
}

async function joinCrew(rawCode, name){
  let group = await getJSON(groupKey(rawCode), true);
  if(!group){
    group = { code: rawCode, members: [name], trips: [] };
    await setJSON(groupKey(rawCode), group, true);
  } else if(!group.members.includes(name)){
    group.members.push(name);
    await setJSON(groupKey(rawCode), group, true);
  }
  state.code = group.code;
  state.name = name;
  state.group = group;
  await setJSON('session', { code: state.code, name }, false);
  return group;
}

async function onJoin(){
  const rawCode = document.getElementById('in-code').value.trim();
  const name = document.getElementById('in-name').value.trim();
  if(!normalizeCode(rawCode) || !name){ renderLanding('Enter both a crew code and your name.', rawCode); return; }
  render(`${brandHeader('loading your crew…')}<div class="loading">Pulling up the tab…</div>`);
  await joinCrew(rawCode, name);
  const params = getUrlParams();
  const linkedTrip = params.get('trip');
  clearUrlParams();
  if(linkedTrip && state.group.trips.some(t => t.id === linkedTrip)){
    openTrip(linkedTrip);
  } else {
    renderDashboard();
  }
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// ---------- avatars: every person in a crew gets a consistent color, everywhere ----------
const AVATAR_COLORS = ['#0EAFA0','#FF5D5D','#FFC145','#7B5CFA','#3D8BFD','#3CB371','#FF7EB6','#FF9142'];
function colorForName(name){
  let h = 0;
  for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function initials(name){
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if(parts.length===0) return '?';
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}
function avatarChipHTML(name){
  return `<span class="avatar" style="background:${colorForName(name)}">${escapeHtml(initials(name))}</span><span>${escapeHtml(name)}</span>`;
}

// reusable inline "add person" chip — avoids window.prompt(), which browsers/sandboxed
// previews often block, so it must use a real input field instead
function addPersonChip(wrap, onAdd){
  const addC = document.createElement('span');
  addC.className = 'chip add';
  addC.textContent = '+ add person';
  addC.onclick = () => {
    wrap.removeChild(addC);
    const holder = document.createElement('span');
    holder.style.cssText = 'display:inline-flex;gap:6px;align-items:center;';
    const inp = document.createElement('input');
    inp.placeholder = 'Name';
    inp.style.cssText = 'font-family:"IBM Plex Mono",monospace;font-size:12.5px;border:1.5px solid var(--ink);border-radius:20px;padding:6px 12px;width:110px;background:var(--paper);color:var(--ink);';
    const okBtn = document.createElement('button');
    okBtn.type = 'button';
    okBtn.className = 'btn small teal';
    okBtn.textContent = 'add';
    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'btn small ghost';
    cancelBtn.textContent = '✕';
    holder.appendChild(inp); holder.appendChild(okBtn); holder.appendChild(cancelBtn);
    wrap.appendChild(holder);
    inp.focus();
    function commit(){
      const val = inp.value.trim();
      if(val) onAdd(val);
    }
    okBtn.onclick = commit;
    cancelBtn.onclick = () => { wrap.removeChild(holder); wrap.appendChild(addC); };
    inp.addEventListener('keydown', e => { if(e.key==='Enter') commit(); if(e.key==='Escape') cancelBtn.onclick(); });
  };
  wrap.appendChild(addC);
}

    if(!exp) return;
    editingId = id;
    document.getElementById('ed').value = exp.desc;
    document.getElementById('ea').value = exp.amount;
    payerSel.value = exp.paidBy;
    splitSel.clear();
    exp.splitAmong.forEach(p => splitSel.add(p));
    drawSplit();
    saveBtn.textContent = 'Save changes';
    cancelBtn.style.display = 'inline';
    document.querySelector('.add-expense-form').scrollIntoView({ behavior:'smooth', block:'center' });
  };

  saveBtn.onclick = async () => {
    const desc = document.getElementById('ed').value.trim();
    const amount = parseFloat(document.getElementById('ea').value);
    const paidBy = payerSel.value;
    if(!desc || !amount || amount<=0 || splitSel.size===0){
      document.getElementById('exp-err').textContent = 'Add a description, a positive amount, and at least one person to split with.';
      return;
    }
    if(editingId){
      const exp = t.expenses.find(x => x.id === editingId);
      if(exp){ exp.desc = desc; exp.amount = amount; exp.paidBy = paidBy; exp.splitAmong = [...splitSel]; }
    } else {
      t.expenses.push({ id: uid(), desc, amount, paidBy, splitAmong: [...splitSel] });
    }
    editingId = null;
    await saveTrip(true);
    renderTripDetail();
  };

  // settle up
  const settleArea = document.getElementById('settle-area');
  const settleNote = document.getElementById('settle-note');
  const toggle = document.getElementById('simplify-toggle');
  const toggleLabel = document.getElementById('simplify-label');
  let simplify = localStorage.getItem('sc:simplify') !== 'off';

  function drawSettle(){
    toggle.className = 'settle-toggle ' + (simplify ? 'on' : 'off');
    toggleLabel.textContent = simplify ? 'Trust me bro' : 'Trust issues? Show me everything';
    settleNote.textContent = simplify
      ? 'Got doubts? No worries, we got ya — fewest payments to settle up.'
      : 'Zero-trust mode: every direct debt between two people, nothing netted, nothing hidden.';

    const { balances, txns } = simplify ? computeSettlement(t.members, t.expenses) : computeRawSettlement(t.members, t.expenses);
    if(t.expenses.length===0){
      settleArea.innerHTML = '<div class="settle-empty">Add expenses to see who owes what.</div>';
    } else if(txns.length===0){
      settleArea.innerHTML = `<div class="settle-empty">Everyone's square — no one owes anything.</div>`;
    } else {
      settleArea.innerHTML = txns.map(tx => `
        <div class="settle-txn">
          <span>${escapeHtml(tx.from)} <span class="arrow">→</span> ${escapeHtml(tx.to)}</span>
          <span class="amt">${money(tx.amount)}</span>
        </div>`).join('');
    }
    const miniWrap = document.createElement('div');
    miniWrap.className = 'balances-mini';
    Object.entries(balances).forEach(([n,v]) => {
      const s = document.createElement('span');
      s.className = 'bal-chip ' + (v>0.005?'pos':v<-0.005?'neg':'zero');
      s.style.borderLeftColor = colorForName(n);
      s.textContent = `${n} ${v>0.005?'+':''}${money(v)}`;
      miniWrap.appendChild(s);
    });
    settleArea.appendChild(miniWrap);
  }
  drawSettle();
  toggle.onclick = () => {
    simplify = !simplify;
    localStorage.setItem('sc:simplify', simplify ? 'on' : 'off');
    drawSettle();
  };

  document.getElementById('btn-download-report').onclick = () => downloadTripReport(t, simplify);
}

function buildReportHTML(t, simplify){

  const { balances, txns } = simplify ? computeSettlement(t.members, t.expenses) : computeRawSettlement(t.members, t.expenses);

  const expenseRows = t.expenses.length ? t.expenses.map(e => `
    <div class="r-exp">
      <div>
        <div class="r-desc">${escapeHtml(e.desc)}</div>
        <div class="r-meta">paid by ${escapeHtml(e.paidBy)} · split among ${e.splitAmong.map(escapeHtml).join(', ')}</div>
      </div>
      <div class="r-amt">${money(e.amount)}</div>
    </div>`).join('') : '<div class="r-empty">No expenses recorded.</div>';

  const balanceChips = Object.entries(balances).map(([n,v]) => `
    <span class="r-bal ${v>0.005?'pos':v<-0.005?'neg':'zero'}">${escapeHtml(n)} ${v>0.005?'+':''}${money(v)}</span>`).join('');

  const txnRows = txns.length ? txns.map(tx => `
    <div class="r-txn"><span>${escapeHtml(tx.from)} → ${escapeHtml(tx.to)}</span><span class="r-txn-amt">${money(tx.amount)}</span></div>`).join('')
    : '<div class="r-empty">Everyone\'s square — no one owes anything.</div>';

  return `<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>${escapeHtml(t.name)} — SplitCrew report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>

  --paper:#FFF7EC; --paper-2:#FFEFD8; --ink:#231942; --ink-soft:#6E6295;
  --teal:#0EAFA0; --teal-soft:#D3F4EF; --red:#FF5D5D; --red-soft:#FFE1DE;
  --gold:#FFC145; --violet:#7B5CFA;
}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;}
html{background:var(--paper);}
body{
  margin:0;color:var(--ink);font-family:'Inter',sans-serif;padding:32px;
  background:var(--paper);
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,93,93,0.16) 3px, transparent 3px),
    radial-gradient(circle at 78% 12%, rgba(14,175,160,0.18) 3px, transparent 3px),
    radial-gradient(circle at 45% 65%, rgba(123,92,250,0.16) 3px, transparent 3px),
    radial-gradient(circle at 90% 78%, rgba(255,193,69,0.22) 3px, transparent 3px),
    radial-gradient(circle at 18% 85%, rgba(61,139,253,0.16) 3px, transparent 3px),
    radial-gradient(circle at 60% 30%, rgba(255,93,93,0.12) 2px, transparent 2px);
  background-size:150px 150px,170px 170px,140px 140px,160px 160px,180px 180px,110px 110px;
  min-height:100vh;
}
.wrap{max-width:640px;margin:0 auto;}

.brand h1 span{color:var(--red);}

.r-title{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 4px;}
.r-meta-top{color:var(--ink-soft);font-size:12px;margin-bottom:12px;}

</style></head>

</div>
<scr` + `ipt>
  var printed = false;

  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(go).catch(go); }
  setTimeout(go, 1200);
</scr` + `ipt>
</body></html>`;
}

function downloadTripReport(t, simplify){
  const html = buildReportHTML(t, simplify);
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const w = window.open(url, '_blank');
  if(!w){
    showErrorToast('Please allow pop-ups for this site to download the report.');
    URL.revokeObjectURL(url);
    return;
  }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function saveTrip(updateIndex){
  await setJSON(tripKey(state.code, state.tripId), state.trip, true);
  if(updateIndex !== undefined || true){
    const idx = state.group.trips.find(x => x.id === state.tripId);
    if(idx){
      idx.memberCount = state.trip.members.length;
      idx.total = state.trip.expenses.reduce((s,e)=>s+e.amount,0);
      idx.name = state.trip.name;
      idx.date = state.trip.date;
      await setJSON(groupKey(state.code), state.group, true);
    }
  }
}

// ---------- init ----------
async function init(){
  render(`${brandHeader('loading…')}<div class="loading">Setting the table…</div>`);
  let session = null;
  try{ session = await getJSON('session', false); }catch(e){ session = null; }

  const params = getUrlParams();
  const linkedCrew = params.get('crew');
  const linkedTrip = params.get('trip');

  if(linkedCrew){
    if(session && session.name){
      // returning visitor clicking a crew link — join instantly with their remembered name
      await joinCrew(linkedCrew, session.name);
      clearUrlParams();
      if(linkedTrip && state.group.trips.some(t => t.id === linkedTrip)){
        openTrip(linkedTrip);
      } else {
        renderDashboard();
      }
      return;
    }
    renderLanding(null, linkedCrew);
    return;
  }

  if(session && session.code && session.name){
    const group = await getJSON(groupKey(session.code), true);
    if(group){
      state.code = session.code; state.name = session.name; state.group = group;
      renderDashboard();
      return;
    }
  }
  renderLanding();
}
init();
</script>
